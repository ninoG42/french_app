app = "french-test-app"
primary_region = "cdg"

[build]

[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  DJANGO_ALLOWED_HOSTS = ".fly.dev"
  DJANGO_SECURE_SSL_REDIRECT = "False"
  WEB_CONCURRENCY = "2"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "media_data"
  destination = "/app/french_test_app/media"

[checks]
  [checks.health]
    type = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/health/"
    [checks.health.headers]
      Host = "french-test-app.fly.dev"
