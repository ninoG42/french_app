kind: pipeline
name: default

environment:
  POSTGRES_USER: 'french_test_app'
  POSTGRES_PASSWORD: ''
  POSTGRES_DB: 'test_french_test_app'
  POSTGRES_HOST_AUTH_METHOD: trust

steps:
- name: lint
  pull: if-not-exists
  image: ghcr.io/astral-sh/uv:python3.14
  environment:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  volumes:
  - name: pre-commit cache
    path: ${PRE_COMMIT_HOME}
  commands:
  - export PRE_COMMIT_HOME=$CI_PROJECT_DIR/.cache/pre-commit
  - uv pip install -q pre-commit pre-commit-uv
  - uv run pre-commit run --show-diff-on-failure --color=always --all-files

- name: test
  pull: if-not-exists
  image: docker:25.0
  environment:
    DATABASE_URL: pgsql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres/$POSTGRES_DB
  commands:
  - docker-compose -f docker-compose.local.yml build
  - docker-compose -f docker-compose.docs.yml build
  - docker-compose -f docker-compose.local.yml run --rm django python manage.py migrate
  - docker-compose -f docker-compose.local.yml up -d
  - docker-compose -f docker-compose.local.yml run django pytest

volumes:
- name: pre-commit cache
  host:
    path: /tmp/drone/cache/pre-commit
